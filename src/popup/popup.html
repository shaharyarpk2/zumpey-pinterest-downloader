<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zumpey.com</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo-icon">Z</div>
        <div class="brand-info">
          <h1>Zumpey.com</h1>
          <span class="version">v1.0.2</span>
        </div>
      </div>
      <button id="btn-open-options" class="icon-btn" title="Open Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </header>

    <!-- Cloud Update Available Notification -->
    <div id="popup-update-banner" class="popup-update-banner" style="display: none;">
      <div class="update-banner-info">
        <span class="update-pulse"></span>
        <span id="popup-update-text">v1.0.2 is available!</span>
      </div>
      <a href="#" id="btn-popup-update-link" class="update-banner-btn">Update</a>
    </div>

    <!-- Page Status & Metrics -->
    <div id="status-card" class="status-card">
      <div class="status-indicator">
        <span class="status-dot online" id="status-dot"></span>
        <span class="status-text" id="status-text">Scanning Pinterest Tab...</span>
      </div>
      
      <div class="metrics-grid">
        <div class="metric-box">
          <span class="metric-value" id="metric-detected">0</span>
          <span class="metric-label">Detected</span>
        </div>
        <div class="metric-box highlight">
          <span class="metric-value" id="metric-selected">0</span>
          <span class="metric-label">Selected</span>
        </div>
      </div>
      <div class="context-pill" id="context-pill">
        <span id="context-label">Page: Feed</span>
      </div>
    </div>

    <!-- Quick Action Controls -->
    <section class="actions-section">
      <button id="btn-popup-harvest" class="harvest-btn-popup">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
        <span id="popup-harvest-label">⚡ Auto-Fetch All Pins</span>
      </button>

      <button id="btn-popup-download" class="primary-btn" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
        </svg>
        <span id="popup-download-text">Download Selected (0)</span>
      </button>

      <div class="btn-row">
        <button id="btn-popup-select-all" class="secondary-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2zm-4 8H7v-2h6v2z"/>
          </svg>
          Select Visible
        </button>
        <button id="btn-popup-clear" class="secondary-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
          Clear
        </button>
      </div>
    </section>

    <!-- Quick Settings Toggles -->
    <section class="quick-settings">
      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-title">HD Originals</span>
          <span class="setting-desc">Extract max native resolution</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-hd-images" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-title">Export Sheet</span>
          <span class="setting-desc">Generate Excel / CSV metadata</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-export-metadata" checked />
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-title">Sheet Format</span>
          <span class="setting-desc">File format for metadata</span>
        </div>
        <select id="select-export-format" class="custom-select">
          <option value="xlsx">Excel (.xlsx)</option>
          <option value="csv">CSV (.csv)</option>
        </select>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>Zumpey.com Extension</span>
      <a href="#" id="link-options">Full Settings &rarr;</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
